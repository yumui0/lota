<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyser un joueur – League of the Ancients</title>
  <link rel="stylesheet" href="css/style.css">
  
</head>
<body>
<div class="page-wrapper">
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand animate-glow" href="index.html">⚔ League of the Ancients</a>
      <ul class="navbar-links">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="formulaire.html">Analyser un joueur</a></li>
        <li><a href="upload.html">Import CSV</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </nav>
  <div class="container mt-24" id="flash" hidden><ul class="flash-list"><li class="flash-msg error" id="flash-msg"></li></ul></div>
  <main>

<section class="hero hero--sm">
  <div class="hero-bg hero-bg--formulaire"></div>
  <div class="hero-bg-fallback"></div>
  <div class="hero-content">
    <div class="hero-sub">Algorithme KPPV</div>
    <div class="hero-divider"></div>
    <h1 class="hero-title hero-title--sm">Analyser un joueur</h1>
  </div>
</section>

<section class="form-section">
  <div class="container">
    <div class="form-wrapper">

      <div class="card animate-fade-up">
        <div class="card-title">Statistiques du joueur</div>

        <form action="resultat.html" method="GET">
          <div class="form-grid">

            <div class="form-group full">
              <label for="pseudo">Pseudo <span class="label-hint">(optionnel)</span></label>
              <input type="text" id="pseudo" name="pseudo"
                     placeholder="Entrez votre pseudo…" maxlength="40">
            </div>

            <div class="form-group">
              <label for="frags">Frags / game <span class="label-hint">ennemis vaincus</span></label>
              <input type="number" id="frags" name="frags"
                     placeholder="ex : 24" step="0.1" min="0" max="99" required>
            </div>

            <div class="form-group">
              <label for="death">Deaths / game <span class="label-hint">fois vaincu</span></label>
              <input type="number" id="death" name="death"
                     placeholder="ex : 12" step="0.1" min="0" max="99" required>
            </div>

            <div class="form-group">
              <label for="powerup">PowerUp / game <span class="label-hint">améliorations</span></label>
              <input type="number" id="powerup" name="powerup"
                     placeholder="ex : 38" step="0.1" min="0" max="200" required>
            </div>

            <div class="form-group">
              <label for="covdist">CovDist / game <span class="label-hint">distance parcourue</span></label>
              <input type="number" id="covdist" name="covdist"
                     placeholder="ex : 11.5" step="0.1" min="0" max="50" required>
            </div>

          </div>

          <div class="divider"></div>

          <div class="flex flex-between flex-wrap gap-16">
            <a href="index.html" class="btn btn-secondary">← Retour</a>
            <button type="submit" class="btn btn-primary">⚔ Analyser avec KPPV</button>
          </div>

        </form>
      </div>

    </div>
  </div>
</section>

</main>
  <footer><span>League of the Ancients</span> &nbsp;·&nbsp; Mini Projet NSI &nbsp;·&nbsp; Sabrine EL</footer>
</div>
<script src="js/main.js"></script>


</body>
</html>
